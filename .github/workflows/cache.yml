name: "Cache"

on:
  push:
  pull_request:

jobs:
  store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone dotfiles
        run: /usr/bin/git clone https://github.com/skowriii/dotfiles.git /home/runner/dotfiles
      - uses: cachix/install-nix-action@v25
      - uses: cachix/cachix-action@v14
        with:
          name: skowriii
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Build NixOS
        run: nix build .#nixosConfigurations.nixbob.config.system.build.toplevel --print-build-logs
